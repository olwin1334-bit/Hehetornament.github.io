<script>
/* Offline guard - pure DOM, no innerHTML with quotes */
(function(){
  var _ot=null;
  window._showOffline=function(msg){
    if(document.getElementById("_zco"))return;
    var d=document.createElement("div");
    d.id="_zco";
    d.style.cssText="position:fixed;inset:0;z-index:99999;background:#04060e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center";
    var icon=document.createElement("div");icon.style.fontSize="3rem";icon.textContent="[X]";d.appendChild(icon);
    var title=document.createElement("div");title.style.cssText="font-family:Orbitron,monospace;font-size:.9rem;font-weight:900;color:#eaecf0;letter-spacing:2px";title.textContent="CONNECTION LOST";d.appendChild(title);
    var sub=document.createElement("div");sub.style.cssText="font-family:Orbitron,monospace;font-size:.5rem;color:#6c7a96;line-height:2;max-width:260px";sub.textContent=(msg||"No internet connection");d.appendChild(sub);
    var cd=document.createElement("span");cd.id="_zco_cd";cd.textContent=" Retrying in 5s...";sub.appendChild(cd);
    var btn=document.createElement("button");btn.style.cssText="padding:11px 26px;border-radius:10px;border:1.5px solid rgba(79,142,247,.4);background:rgba(79,142,247,.1);color:#4f8ef7;font-size:.52rem;cursor:pointer;font-weight:700;font-family:Orbitron,monospace";
    btn.textContent="RETRY NOW";btn.onclick=function(){window._retryNow&&window._retryNow();};d.appendChild(btn);
    document.body.appendChild(d);
    var c=5;
    _ot=setInterval(function(){c--;var r=document.getElementById("_zco_cd");if(r)r.textContent=c>0?" Retrying in "+c+"s...":" Retrying...";if(c<=0){clearInterval(_ot);window._retryNow&&window._retryNow();}},1000);
  };
  window._hideOffline=function(){var d=document.getElementById("_zco");if(d)d.remove();if(_ot)clearInterval(_ot);};
  window.addEventListener("online",function(){window._hideOffline();});
  window.addEventListener("offline",function(){window._showOffline("Internet connection lost.");});
  window.addEventListener("error",function(e){e.preventDefault();return true;},true);
  window.addEventListener("unhandledrejection",function(e){e.preventDefault();});
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#04060e;--s1:#080d18;--s2:#0c1220;--s3:#111929;--a:#4f8ef7;--gold:#e8b84b;--green:#0ecb81;--red:#f6465d;--purple:#7c5df7;--t1:#eaecf0;--t2:#6c7a96;--t3:#2d3a55;--fhd:Orbitron,monospace;--fmono:"JetBrains Mono",monospace;--topH:54px}
html,body{visibility:visible;height:100%;background:var(--bg);color:var(--t1);font-family:Inter,sans-serif}
#topbar{height:var(--topH);background:rgba(7,9,15,.96);border-bottom:1px solid rgba(0,212,255,.12);display:flex;align-items:center;padding:0 14px;gap:8px;position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(20px)}
.back{width:34px;height:34px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#main{margin-top:var(--topH);padding-bottom:80px}
.hero{padding:22px 16px 16px;background:var(--s1);border-bottom:1px solid rgba(232,184,75,.12);text-align:center}
.tabs{display:flex;background:var(--s1);border-bottom:1px solid rgba(255,255,255,.05);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:12px 16px;font-family:var(--fhd);font-size:.5rem;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.2s}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.t-card{background:var(--s1);border:1px solid rgba(255,255,255,.06);border-radius:13px;margin:10px 14px;overflow:hidden}
.t-header{padding:14px;background:linear-gradient(135deg,rgba(232,184,75,.1),rgba(79,142,247,.06))}
.t-stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid rgba(255,255,255,.05)}
.t-stat{padding:10px;text-align:center;border-right:1px solid rgba(255,255,255,.05)}
.t-stat:last-child{border-right:none}
.tsl{font-family:var(--fhd);font-size:.3rem;color:var(--t3);letter-spacing:1px;margin-bottom:3px}
.tsv{font-family:var(--fmono);font-size:.56rem;font-weight:700}
.t-prize{padding:10px 14px;background:rgba(232,184,75,.05);border-top:1px solid rgba(232,184,75,.1)}
.t-btn{width:calc(100% - 28px);margin:10px 14px;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),var(--a));color:#fff;font-family:var(--fhd);font-size:.56rem;font-weight:900;cursor:pointer;letter-spacing:1px}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.spinner{width:22px;height:22px;border:2px solid rgba(232,184,75,.15);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:28px auto}
.empty{text-align:center;padding:36px 20px;color:var(--t3);font-family:var(--fhd);font-size:.52rem}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>

  <div class="hero">
    <div style="font-size:2.8rem;margin-bottom:8px">&#127942;</div>

  </div>
  <div id="t-content"><div class="spinner"></div></div>
</div>
<script>
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function toast(msg,type){var t=document.createElement("div");t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:"+(type==="error"?"#f6465d":type==="success"?"#0ecb81":"#4f8ef7")+";color:#fff;padding:10px 22px;border-radius:10px;font-family:Orbitron,monospace;font-size:.56rem;z-index:99999;font-weight:700";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2800);}
function save(data){if(!db||!G.uid)return;db.collection("players").doc(G.uid).update(data).catch(function(){});}

var _tTab="active";

function tTab(el,t){
  document.querySelectorAll("#t-tabs .tab").forEach(function(x){x.classList.remove("active");});
  if(el)el.classList.add("active");
  _tTab=t;
  renderTournaments();
}
window.tTab=tTab;

var DEMOS=[
  {id:"weekly_trade",name:"Weekly Trade War",type:"Binary Trading",status:"active",entryFee:0,prizePool:50,participants:127,maxPlayers:200,prizes:["$25","$15","$10"],endTs:Date.now()+3*24*3600000},
  {id:"mining_race",name:"Mining Sprint",type:"Mining Race",status:"active",entryFee:0,prizePool:30,participants:89,maxPlayers:150,prizes:["$15","$10","$5"],endTs:Date.now()+18*3600000},
  {id:"wealth_cup",name:"Wealth Cup",type:"Portfolio Growth",status:"upcoming",entryFee:1,prizePool:100,participants:0,maxPlayers:100,prizes:["$60","$25","$15"],endTs:Date.now()+7*24*3600000}
];

function fmtTime(ms){
  if(ms<=0)return"ENDED";
  var h=Math.floor(ms/3600000);
  var m=Math.floor((ms%3600000)/60000);
  if(h>=24)return Math.floor(h/24)+"d "+Math.floor(h%24)+"h";
  return h+"h "+m+"m";
}

function renderTournaments(){
  var c=document.getElementById("t-content");
  if(!c)return;
  c.innerHTML="";
  if(_tTab==="leaderboard"){renderLeaderboard();return;}
  if(_tTab==="history"){renderHistory();return;}
  var list=DEMOS.filter(function(t){return t.status===(_tTab==="active"?"active":"upcoming");});
  if(db){
    db.collection("tournaments").where("status","==",_tTab==="active"?"active":"upcoming").limit(10).get()
      .then(function(snap){snap.forEach(function(doc){var t=doc.data();t.id=doc.id;if(!DEMOS.some(function(d){return d.id===t.id;}))list.push(t);list.forEach(function(t,i){c.appendChild(makeCard(t,i));});})})
      .catch(function(){});
  }
  if(list.length===0){c.innerHTML="<div class='empty'>No "+(_tTab==="active"?"live":"upcoming")+" tournaments</div>";return;}
  list.forEach(function(t,i){c.appendChild(makeCard(t,i));});
}

window.renderTournaments=renderTournaments;
function makeCard(t,i){
  var joined=(G.joinedTournaments||[]).indexOf(t.id)>=0;
  var full=(t.participants||0)>=(t.maxPlayers||999);
  var card=document.createElement("div");
  card.className="t-card";
  card.style.animationDelay=(i*0.08)+"s";

  var hdr=document.createElement("div");hdr.className="t-header";
  var nm=document.createElement("div");nm.style.cssText="font-family:var(--fhd);font-size:.64rem;font-weight:900;color:var(--t1)";nm.textContent=t.name||"Tournament";hdr.appendChild(nm);
  var tp=document.createElement("div");tp.style.cssText="font-family:var(--fhd);font-size:.36rem;color:var(--gold);margin-top:2px";tp.textContent=t.type||"Trading";hdr.appendChild(tp);
  card.appendChild(hdr);

  var stats=document.createElement("div");stats.className="t-stats";
  function makeStat(lbl,val,col){var s=document.createElement("div");s.className="t-stat";var l=document.createElement("div");l.className="tsl";l.textContent=lbl;var v=document.createElement("div");v.className="tsv";if(col)v.style.color=col;v.textContent=val;s.appendChild(l);s.appendChild(v);return s;}
  stats.appendChild(makeStat("PRIZE POOL","$"+(t.prizePool||0),"var(--gold)"));
  stats.appendChild(makeStat("PLAYERS",(t.participants||0)+"/"+(t.maxPlayers||"?"),"var(--a)"));
  stats.appendChild(makeStat("TIME LEFT",fmtTime((t.endTs||0)-Date.now()),"var(--red)"));
  card.appendChild(stats);

  var prize=document.createElement("div");prize.className="t-prize";
  prize.innerHTML="<span style='font-family:var(--fhd);font-size:.34rem;color:var(--t3)'>TOP 3: </span><span style='font-family:var(--fmono);font-size:.5rem;font-weight:700;color:var(--gold)'>"+(t.prizes||[]).join(" &bull; ")+"</span>";
  card.appendChild(prize);

  if(t.entryFee>0){var fee=document.createElement("div");fee.style.cssText="padding:5px 14px;font-family:var(--fhd);font-size:.36rem;color:var(--t3)";fee.textContent="Entry: $"+t.entryFee+" USDT";card.appendChild(fee);}

    // Entry closes 2 hours before tournament ends
  var now=Date.now();
  var entryClosed=(t.endTs-now)<(2*3600000)&&(t.endTs-now)>0;
  var tournamentOver=(t.endTs-now)<=0;
  
  // Can exit within 1 hour of joining (store joinTime in G)
  var joinKey='tjoin_'+t.id;
  var joinTime=G[joinKey]||0;
  var canExit=joined&&joinTime>0&&(now-joinTime)<(3600000);

  var btn=document.createElement("button");btn.className="t-btn";
  
  if(tournamentOver){
    btn.disabled=true;btn.textContent="ENDED";btn.style.opacity=".5";
  } else if(joined){
    btn.style.background="rgba(14,203,129,.15)";btn.style.color="var(--green)";
    btn.textContent="✓ REGISTERED"+(canExit?" (EXIT AVAILABLE)":"");
    if(canExit){
      btn.onclick=function(){exitTournament(t.id,t,btn);};
    } else {
      btn.disabled=true;
    }
  } else if(full){
    btn.disabled=true;btn.textContent="FULL";btn.style.opacity=".5";
  } else if(entryClosed){
    btn.disabled=true;btn.textContent="ENTRIES CLOSED (< 2hrs)";btn.style.opacity=".5";
  } else {
    btn.textContent=t.entryFee>0?"JOIN - $"+t.entryFee:"JOIN FREE";
    (function(tid,td,b){b.onclick=function(){confirmJoin(tid,td,b);};})(t.id,t,btn);
  }
  card.appendChild(btn);
  
  // Exit timer notice
  if(joined&&canExit){
    var exitNotice=document.createElement("div");
    var remMs=3600000-(now-joinTime);
    var remMin=Math.ceil(remMs/60000);
    exitNotice.style.cssText="font-family:var(--fhd);font-size:.34rem;color:var(--gold);text-align:center;padding:6px;";
    exitNotice.textContent="You can exit for "+remMin+" more min";
    card.appendChild(exitNotice);
  }
  return card;
}

function confirmJoin(tid,t,btn){
  if(!G.uid){toast("Log in first","error");return;}
  // Confirm dialog
  var feeMsg=t.entryFee>0?" Entry fee: $"+t.entryFee+" USDT":"Free entry";
  var ok=window.confirm("Join "+t.name+"?\n"+feeMsg+"\nYou can exit within 1 hour if you change your mind.");
  if(!ok)return;
  joinTournament(tid,t,btn);
}

function joinTournament(tid,t,btn){
  if(!G.uid){toast("Log in first","error");return;}
  var joined=G.joinedTournaments||[];
  if(joined.indexOf(tid)>=0){toast("Already registered","info");return;}
  var now=Date.now();
  // Check entry cutoff: 2 hours before end
  if(t.endTs&&(t.endTs-now)<(2*3600000)){
    toast("Entries closed — less than 2hrs remaining","error");return;
  }
  if(t.entryFee>0&&(G.bal||0)<t.entryFee){toast("Need $"+t.entryFee+" to join","error");return;}
  btn.disabled=true;btn.textContent="JOINING...";
  var upd={
    joinedTournaments:FS?FS.FieldValue.arrayUnion(tid):joined.concat([tid])
  };
  upd['tjoin_'+tid]=now; // store join time for 1hr exit window
  if(t.entryFee>0){G.bal=(G.bal||0)-t.entryFee;upd.bal=G.bal;}
  db.collection("players").doc(G.uid).update(upd)
    .then(function(){
      G.joinedTournaments=(G.joinedTournaments||[]).concat([tid]);
      G['tjoin_'+tid]=now;
      // Also write to tournaments collection for leaderboard
      db.collection("tournaments").doc(tid).collection("entries").doc(G.uid).set({
        uid:G.uid,name:G.name||"Player",joinedAt:FS.FieldValue.serverTimestamp(),pid:G.pid||""
      }).catch(function(){});
      btn.textContent="✓ REGISTERED";btn.style.background="rgba(14,203,129,.15)";btn.style.color="var(--green)";
      toast("Registered! 1hr exit window active.","success");
      setTimeout(function(){renderTournaments();},300);
    })
    .catch(function(e){btn.disabled=false;btn.textContent="JOIN";toast("Error: "+e.message,"error");});
}

function exitTournament(tid,t,btn){
  if(!G.uid){return;}
  var joinKey='tjoin_'+tid;
  var joinTime=G[joinKey]||0;
  if(Date.now()-joinTime>3600000){toast("1-hour exit window expired","error");return;}
  var ok=window.confirm("Leave "+t.name+"?"+(t.entryFee>0?"\n$"+t.entryFee+" will be refunded.":""));
  if(!ok)return;
  btn.disabled=true;btn.textContent="LEAVING...";
  var upd={
    joinedTournaments:FS?FS.FieldValue.arrayRemove(tid):(G.joinedTournaments||[]).filter(function(x){return x!==tid;})
  };
  upd[joinKey]=0;
  if(t.entryFee>0){upd.bal=FS.FieldValue.increment(t.entryFee);G.bal=(G.bal||0)+t.entryFee;}
  db.collection("players").doc(G.uid).update(upd)
    .then(function(){
      G.joinedTournaments=(G.joinedTournaments||[]).filter(function(x){return x!==tid;});
      G[joinKey]=0;
      // Remove entry from tournament
      db.collection("tournaments").doc(tid).collection("entries").doc(G.uid).delete().catch(function(){});
      toast("Left tournament"+(t.entryFee>0?" — $"+t.entryFee+" refunded":""),"success");
      setTimeout(function(){renderTournaments();},300);
    })
    .catch(function(e){btn.disabled=false;toast("Error: "+e.message,"error");});
}
window.joinTournament=joinTournament;

function renderLeaderboard(){
  var el=document.getElementById('t-content');
  el.innerHTML='<div style="padding:10px 14px 4px;font-family:var(--fhd);font-size:.42rem;color:var(--t3);letter-spacing:2px">TOURNAMENT RANKINGS</div>';
  var sp=document.createElement('div');sp.className='spinner';el.appendChild(sp);
  if(!db){el.innerHTML='<div class="empty">Log in to see rankings</div>';return;}
  db.collection('players').orderBy('totalTrades','desc').limit(20).get()
    .then(function(snap){
      sp.remove();
      snap.forEach(function(doc,i){
        var p=doc.data();
        var row=document.createElement('div');row.className='lb-row';
        var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        var rankDiv=document.createElement('div');
        rankDiv.className=i<3?'lb-rank top':'lb-rank';
        rankDiv.textContent=medal||(i+1);
        var avDiv=document.createElement('div');
        avDiv.style.cssText='width:36px;height:36px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-family:var(--fhd);font-size:.48rem;font-weight:700;border:1.5px solid rgba(232,184,75,'+(i<3?'0.3':'0.1')+');flex-shrink:0';
        avDiv.textContent=(p.name||'?').slice(0,2).toUpperCase();
        var infoDiv=document.createElement('div');infoDiv.style.flex='1;overflow:hidden';
        var nameDiv=document.createElement('div');nameDiv.style.cssText='font-family:var(--fhd);font-size:.52rem;font-weight:700';
        if(doc.id===G.uid){var you=document.createElement('span');you.style.color='var(--a)';you.textContent='YOU — ';nameDiv.appendChild(you);}
        nameDiv.appendChild(document.createTextNode(p.name||'Player'));
        var subDiv=document.createElement('div');subDiv.style.cssText='font-family:var(--fhd);font-size:.34rem;color:var(--t3)';
        subDiv.textContent='LV'+(p.level||1)+' • '+(p.totalTrades||p.wins||0)+' trades';
        infoDiv.appendChild(nameDiv);infoDiv.appendChild(subDiv);
        var valDiv=document.createElement('div');valDiv.style.cssText='font-family:var(--fmono);font-size:.56rem;font-weight:700;color:var(--gold)';
        valDiv.textContent='$'+((p.bal||0).toFixed(2));
        row.appendChild(rankDiv);row.appendChild(avDiv);row.appendChild(infoDiv);row.appendChild(valDiv);
        el.appendChild(row);
      });
    }).catch(function(){el.innerHTML='<div class="empty">Error loading rankings</div>';});
}

function renderHistory(){
  var c=document.getElementById("t-content");c.innerHTML="";
  var card=document.createElement("div");card.className="t-card";card.style.margin="10px 14px";
  var inner=document.createElement("div");inner.style.padding="14px";
  var title=document.createElement("div");title.style.cssText="font-family:var(--fhd);font-size:.56rem;font-weight:900;color:var(--t1);margin-bottom:10px";title.textContent="PAST TOURNAMENTS";inner.appendChild(title);
  [{name:"Weekly Trade War #1",date:"7 days ago",pool:50},{name:"Mining Sprint #3",date:"14 days ago",pool:30}].forEach(function(h){
    var row=document.createElement("div");row.style.cssText="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)";
    var left=document.createElement("div");var nm=document.createElement("div");nm.style.cssText="font-family:var(--fhd);font-size:.52rem;font-weight:700";nm.textContent=h.name;var dt=document.createElement("div");dt.style.cssText="font-family:var(--fhd);font-size:.36rem;color:var(--t3);margin-top:2px";dt.textContent="Ended "+h.date;left.appendChild(nm);left.appendChild(dt);
    var right=document.createElement("div");right.style.textAlign="right";var pool=document.createElement("div");pool.style.cssText="font-family:var(--fmono);font-size:.52rem;font-weight:700;color:var(--gold)";pool.textContent="$"+h.pool+" Prize";var st=document.createElement("div");st.style.cssText="font-family:var(--fhd);font-size:.34rem;color:var(--green)";st.textContent="COMPLETED";right.appendChild(pool);right.appendChild(st);
    row.appendChild(left);row.appendChild(right);inner.appendChild(row);
  });
  card.appendChild(inner);c.appendChild(card);
}
window.renderHistory=renderHistory;

var ZCS={
  restore:function(){try{var p=new URLSearchParams(window.location.search);var uid=p.get("uid");var s=p.get("s");if(s)try{Object.assign(G,JSON.parse(decodeURIComponent(s)));}catch(e){}if(uid&&uid!=="guest")G.uid=uid;}catch(e){}},
  sendReady:function(pg){try{if(window.parent!==window)window.parent.postMessage({type:"ZC_READY",page:pg},"*");}catch(e){}}
};

(function(){
  ZCS.restore();
  var _d=false;
  window._retryNow=function(){window._hideOffline&&window._hideOffline();if(!_d)startAuth();else renderTournaments();};
  function startAuth(){
    window._hideOffline&&window._hideOffline();
    if(typeof firebase==="undefined"){if(!window._fbT)window._fbT=0;window._fbT++;if(window._fbT>50){window._showOffline&&window._showOffline("Service unavailable.");return;}setTimeout(startAuth,30);return;}
    if(!window.auth){try{if(!firebase.apps.length)firebase.initializeApp(window._FC||{});window.auth=firebase.auth();window.db=firebase.firestore();window.FS=firebase.firestore;db=window.db;auth=window.auth;FS=window.FS;}catch(e){setTimeout(startAuth,50);return;}}
    auth.onAuthStateChanged(function(u){if(_d)return;_d=true;if(u)G.uid=u.uid;if(G.uid&&!G.isGuest){db.collection("players").doc(G.uid).get().then(function(s){if(s.exists)Object.assign(G,s.data());boot();}).catch(function(){window._showOffline&&window._showOffline("Could not reach server.");});}else boot();},function(){window._showOffline&&window._showOffline("Connection error.");});
    setTimeout(function(){if(!_d){_d=true;boot();}},6000);
  }
  function boot(){ZCS.sendReady("tournament");setTimeout(renderTournaments,50);}
  startAuth();
})();
</script>
